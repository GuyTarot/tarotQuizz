<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TarotQuizz</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,0.15);
}

h1{
    text-align:center;
    color:#2c3e50;
}

.question{
    margin-bottom:30px;
    padding-bottom:20px;
    border-bottom:1px solid #ddd;
}

.question h3{
    color:#34495e;
}

button{
    background:#2c3e50;
    color:white;
    border:none;
    padding:15px 25px;
    border-radius:8px;
    cursor:pointer;
    font-size:18px;
}

button:hover{
    background:#1a252f;
}

#resultat{
    display:none;
    margin-top:30px;
    padding:20px;
    background:#ecf9f0;
    border:1px solid #28a745;
    border-radius:10px;
}

.bonne{
    color:green;
    margin-top:10px;
}

.mauvaise{
    color:red;
    margin-top:10px;
}

.explication{
    margin-top:5px;
    font-style:italic;
}

</style>

</head>

<body>

<div class="container">

<h1 id="titreQuiz"></h1>

<p>

Nom :

<input type="text"
id="nom"
placeholder="Votre prénom">

</p>

<form id="quizContainer"></form>

<button onclick="corrigerQuiz()">

Valider le quiz

</button>

<div id="resultat"></div>

</div>

<script>

/************************************************
MODIFIER UNIQUEMENT CI-DESSOUS
************************************************/

const quizTitre =
"Quiz : Le Bateleur";

const quizData = [

{
question :
"Quelle est la mission principale du Bateleur ?",

reponses : [
"Comprendre avant d'agir",
"Faire le premier pas",
"Construire une structure durable",
"Trouver l'équilibre"
],

bonne : 1,

explication :
"Le Bateleur est l'arcane du commencement. Sa mission est d'oser faire le premier pas."
},

{
question :
"Parmi ces propositions, laquelle correspond le mieux à l'énergie lumière du Bateleur ?",

reponses : [
"Prudence, retrait, solitude",
"Autorité, contrôle, stabilité",
"Initiative, créativité, apprentissage",
"Intuition, secret, réflexion"
],

bonne : 2,

explication :
"Le Bateleur apprend par l'action, l'expérimentation et l'initiative."
},

{
question :
"Dans un tirage, le Bateleur apparaît en position CONTRE. Quelle interprétation est la plus cohérente ?",

reponses : [
"Une réussite complète est garantie",
"Le consultant doit abandonner son projet",
"Le consultant manque peut-être d'informations ou agit trop vite",
"Le consultant doit rester seul pendant plusieurs mois"
],

bonne : 2,

explication :
"Le Bateleur peut signaler une précipitation ou un manque de préparation."
},

{
question :
"Quelle est l'erreur fréquente du Bateleur ?",

reponses : [
"Confondre intuition et émotion",
"Confondre enthousiasme et compétence",
"Confondre partage et sacrifice",
"Confondre liberté et engagement"
],

bonne : 1,

explication :
"L'envie d'agir ne remplace pas encore l'expérience."
},

{
question :
"Laquelle de ces phrases résume le mieux le Bateleur lumineux ?",

reponses : [
"J'attends le bon moment",
"Je cherche la vérité",
"J'ose essayer",
"Je maîtrise mes émotions"
],

bonne : 2,

explication :
"Le Bateleur ose agir même sans tout maîtriser."
}

];

/************************************************
NE RIEN MODIFIER EN DESSOUS
************************************************/

document.getElementById("titreQuiz").innerText =
quizTitre;

const container =
document.getElementById("quizContainer");

quizData.forEach((q, index)=>{

let html =
`
<div class="question">

<h3>

Question ${index+1}

</h3>

<p>${q.question}</p>
`;

q.reponses.forEach((r, i)=>{

html +=
`
<label>

<input
type="radio"
name="q${index}"
value="${i}">

${r}

</label>

<br>

`;

});

html +=
`
<div id="feedback${index}"></div>

</div>
`;

container.innerHTML += html;

});

function corrigerQuiz(){

let score = 0;

quizData.forEach((q,index)=>{

let reponse =
document.querySelector(
'input[name="q'+index+'"]:checked'
);

let feedback =
document.getElementById(
"feedback"+index
);

if(
reponse &&
parseInt(reponse.value)
=== q.bonne
){

score++;

feedback.innerHTML =
`
<div class="bonne">

✅ Bonne réponse

</div>

<div class="explication">

${q.explication}

</div>
`;

}
else{

feedback.innerHTML =
`
<div class="mauvaise">

❌ Mauvaise réponse

</div>

<div class="explication">

Bonne réponse :
${q.reponses[q.bonne]}

<br><br>

${q.explication}

</div>
`;

}

});

let appreciation = "";

if(score === quizData.length){

appreciation =
"⭐⭐⭐⭐⭐ Maîtrise parfaite";

}
else if(score >= 4){

appreciation =
"⭐⭐⭐⭐ Très bonne compréhension";

}
else if(score >= 3){

appreciation =
"⭐⭐⭐ Bases acquises";

}
else if(score >= 2){

appreciation =
"⭐⭐ À renforcer";

}
else{

appreciation =
"⭐ Révision nécessaire";

}

document.getElementById(
"resultat"
).style.display="block";

document.getElementById(
"resultat"
).innerHTML =

`
<h2>

Résultat

</h2>

<p>

Score :
<strong>

${score}/${quizData.length}

</strong>

</p>

<p>

${appreciation}

</p>
`;

window.scrollTo(
0,
document.body.scrollHeight
);

}

</script>

</body>

</html>
