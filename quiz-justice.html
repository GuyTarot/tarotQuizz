<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TarotQuizz</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,0.15);
}

h1{
    text-align:center;
    color:#2c3e50;
}

.question{
    margin-bottom:30px;
    padding-bottom:20px;
    border-bottom:1px solid #ddd;
}

.question h3{
    color:#34495e;
}

button{
    background:#2c3e50;
    color:white;
    border:none;
    padding:15px 25px;
    border-radius:8px;
    cursor:pointer;
    font-size:18px;
}

button:hover{
    background:#1a252f;
}

#resultat{
    display:none;
    margin-top:30px;
    padding:20px;
    background:#ecf9f0;
    border:1px solid #28a745;
    border-radius:10px;
}

.bonne{
    color:green;
    margin-top:10px;
}

.mauvaise{
    color:red;
    margin-top:10px;
}

.explication{
    margin-top:5px;
    font-style:italic;
}

</style>

</head>

<body>

<div class="container">

<h1 id="titreQuiz"></h1>

<p>

Nom :

<input type="text"
id="nom"
placeholder="Votre prénom">

</p>

<form id="quizContainer"></form>

<button onclick="corrigerQuiz()">

Valider le quiz

</button>

<div id="resultat"></div>

</div>

<script>

/************************************************
MODIFIER UNIQUEMENT CI-DESSOUS
************************************************/

const quizTitre =
"Quiz : La Justice";

const quizData = [

{
question :
"Quelle est la mission principale de la Justice ?",

reponses : [
"Faire avancer les projets",
"Trouver l'équilibre et assumer les conséquences de ses choix",
"Accumuler davantage de connaissances",
"Transformer ce qui doit mourir"
],

bonne : 1,

explication :
"La Justice cherche l'équilibre, l'ajustement et la cohérence entre les actes et leurs conséquences."
},

{
question :
"Parmi ces propositions, laquelle correspond le mieux à l'énergie lumière de la Justice ?",

reponses : [
"Équité, discernement, responsabilité",
"Créativité, imagination, spontanéité",
"Intuition, mystère, secret",
"Patience, retrait, méditation"
],

bonne : 0,

explication :
"La Justice évalue avec lucidité et cherche ce qui est juste plutôt que ce qui lui plaît."
},

{
question :
"Dans un tirage, la Justice apparaît en position CONTRE. Quelle interprétation est la plus cohérente ?",

reponses : [
"Le consultant refuse de voir la réalité telle qu'elle est",
"Le consultant agit trop lentement",
"Le consultant manque d'énergie",
"Le consultant doit voyager davantage"
],

bonne : 0,

explication :
"La Justice en ombre peut signaler un manque d'objectivité ou un refus d'assumer certaines conséquences."
},

{
question :
"Quelle est l'erreur fréquente de la Justice ?",

reponses : [
"Confondre réflexion et intuition",
"Confondre équité et rigidité",
"Confondre créativité et imagination",
"Confondre vitesse et efficacité"
],

bonne : 1,

explication :
"La Justice peut devenir rigide lorsqu'elle cherche à appliquer des règles sans tenir compte du contexte humain."
},

{
question :
"Laquelle de ces phrases résume le mieux la Justice lumineuse ?",

reponses : [
"Je prends la place qui me revient",
"Je cherche l'équilibre juste",
"Je suis mes émotions",
"Je fais confiance au hasard"
],

bonne : 1,

explication :
"L'objectif de la Justice est de rétablir l'équilibre et de prendre des décisions cohérentes."
},

{
question :
"Complète la progression initiatique : Chariot : J'avance – Justice : ?",

reponses : [
"Je choisis",
"Je maîtrise",
"J'équilibre",
"Je cherche"
],

bonne : 2,

explication :
"Dans ton cycle initiatique, la Justice correspond à la mission : J'équilibre."
},

{
question :
"Quelle différence fondamentale existe entre le Chariot et la Justice ?",

reponses : [
"Le Chariot avance, la Justice vérifie la direction et les conséquences",
"Le Chariot réfléchit, la Justice agit",
"La Justice choisit, le Chariot transmet",
"Ces deux cartes racontent exactement la même étape"
],

bonne : 0,

explication :
"Le Chariot met l'énergie en mouvement. La Justice s'assure que cette énergie est utilisée avec justesse."
},

{
question :
"Quelle différence fondamentale existe entre l'Empereur et la Justice ?",

reponses : [
"L'Empereur construit un cadre ; la Justice évalue si ce cadre est juste",
"L'Empereur est émotionnel ; la Justice est mentale",
"La Justice agit tandis que l'Empereur réfléchit",
"Aucune différence significative"
],

bonne : 0,

explication :
"L'Empereur bâtit la structure. La Justice vérifie l'équilibre et la légitimité de cette structure."
},

{
question :
"Un consultant travaille énormément pour atteindre un objectif professionnel, mais néglige sa santé et sa vie personnelle. La Justice apparaît en conseil. Que suggère-t-elle ?",

reponses : [
"Continuer dans la même direction",
"Accélérer encore davantage",
"Réexaminer les équilibres de sa vie avant que le déséquilibre ne produise ses conséquences",
"Changer immédiatement de métier"
],

bonne : 2,

explication :
"La Justice rappelle qu'un déséquilibre finit toujours par produire un rééquilibrage, choisi ou subi."
},


{
question :
"Un conducteur roule régulièrement au-dessus de la vitesse autorisée. Il estime maîtriser parfaitement son véhicule et ne voit aucun problème à sa conduite. Quelques semaines plus tard, il reçoit plusieurs contraventions après avoir été flashé. La Justice apparaît en conseil. Que représente-t-elle le plus probablement ?",

reponses : [
"Une malchance passagère",
"Une injustice administrative",
"Un rééquilibrage montrant que chaque action produit des conséquences",
"Une invitation à rouler encore plus vite"
],

bonne : 2,

explication :
"Le Chariot représente l'avancée et la volonté d'aller de l'avant. Mais lorsque cette énergie dépasse les limites ou néglige le cadre, la Justice intervient. Elle ne punit pas : elle rééquilibre. Dans cet exemple, l'automobiliste est simplement confronté aux conséquences de ses propres choix."
}


];

/************************************************
NE RIEN MODIFIER EN DESSOUS
************************************************/

document.getElementById("titreQuiz").innerText =
quizTitre;

const container =
document.getElementById("quizContainer");

quizData.forEach((q, index)=>{

let html =
`
<div class="question">

<h3>

Question ${index+1}

</h3>

<p>${q.question}</p>
`;

q.reponses.forEach((r, i)=>{

html +=
`
<label>

<input
type="radio"
name="q${index}"
value="${i}">

${r}

</label>

<br>

`;

});

html +=
`
<div id="feedback${index}"></div>

</div>
`;

container.innerHTML += html;

});

function corrigerQuiz(){

let score = 0;

quizData.forEach((q,index)=>{

let reponse =
document.querySelector(
'input[name="q'+index+'"]:checked'
);

let feedback =
document.getElementById(
"feedback"+index
);

if(
reponse &&
parseInt(reponse.value)
=== q.bonne
){

score++;

feedback.innerHTML =
`
<div class="bonne">

✅ Bonne réponse

</div>

<div class="explication">

${q.explication}

</div>
`;

}
else{

feedback.innerHTML =
`
<div class="mauvaise">

❌ Mauvaise réponse

</div>

<div class="explication">

Bonne réponse :
${q.reponses[q.bonne]}

<br><br>

${q.explication}

</div>
`;

}

});

let appreciation = "";

if(score === quizData.length){

appreciation =
"⭐⭐⭐⭐⭐ Maîtrise parfaite";

}
else if(score >= 4){

appreciation =
"⭐⭐⭐⭐ Très bonne compréhension";

}
else if(score >= 3){

appreciation =
"⭐⭐⭐ Bases acquises";

}
else if(score >= 2){

appreciation =
"⭐⭐ À renforcer";

}
else{

appreciation =
"⭐ Révision nécessaire";

}

document.getElementById(
"resultat"
).style.display="block";

document.getElementById(
"resultat"
).innerHTML =

`
<h2>

Résultat

</h2>

<p>

Score :
<strong>

${score}/${quizData.length}

</strong>

</p>

<p>

${appreciation}

</p>
`;

window.scrollTo(
0,
document.body.scrollHeight
);

}

</script>

</body>

</html>
