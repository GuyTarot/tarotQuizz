<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TarotQuizz</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,0.15);
}

h1{
    text-align:center;
    color:#2c3e50;
}

.question{
    margin-bottom:30px;
    padding-bottom:20px;
    border-bottom:1px solid #ddd;
}

.question h3{
    color:#34495e;
}

button{
    background:#2c3e50;
    color:white;
    border:none;
    padding:15px 25px;
    border-radius:8px;
    cursor:pointer;
    font-size:18px;
}

button:hover{
    background:#1a252f;
}

#resultat{
    display:none;
    margin-top:30px;
    padding:20px;
    background:#ecf9f0;
    border:1px solid #28a745;
    border-radius:10px;
}

.bonne{
    color:green;
    margin-top:10px;
}

.mauvaise{
    color:red;
    margin-top:10px;
}

.explication{
    margin-top:5px;
    font-style:italic;
}

</style>

</head>

<body>

<div class="container">

<h1 id="titreQuiz"></h1>

<p>

Nom :

<input type="text"
id="nom"
placeholder="Votre prénom">

</p>

<form id="quizContainer"></form>

<button onclick="corrigerQuiz()">

Valider le quiz

</button>

<div id="resultat"></div>

</div>

<script>

/************************************************
MODIFIER UNIQUEMENT CI-DESSOUS
************************************************/

const quizTitre =
"Quiz : Tempérance";

const quizData = [

{
question :
"Quelle est la mission principale de Tempérance ?",

reponses : [
"Transformer brutalement une situation",
"Trouver un nouvel équilibre après une transformation",
"Prendre le pouvoir sur les autres",
"Accélérer les événements"
],

bonne : 1,

explication :
"Tempérance apparaît après l'Arcane Sans Nom. La transformation a eu lieu ; il faut maintenant apprendre à vivre avec cette nouvelle réalité."
},

{
question :
"Parmi ces propositions, laquelle correspond le mieux à l'énergie lumière de Tempérance ?",

reponses : [
"Harmonie, fluidité, adaptation",
"Domination, puissance, contrôle",
"Rupture, destruction, séparation",
"Ambition, compétition, conquête"
],

bonne : 0,

explication :
"Tempérance cherche la circulation harmonieuse des énergies. Elle apaise ce qui était tendu et relie ce qui était séparé."
},

{
question :
"Dans un tirage, Tempérance apparaît en position CONTRE. Quelle interprétation est la plus cohérente ?",

reponses : [
"Le consultant refuse d'adapter son comportement à sa nouvelle situation",
"Le consultant agit trop lentement",
"Le consultant manque de créativité",
"Le consultant doit voyager"
],

bonne : 0,

explication :
"Tempérance en ombre peut indiquer une difficulté à retrouver un nouvel équilibre après une période de changement."
},

{
question :
"Quelle est l'erreur fréquente de Tempérance ?",

reponses : [
"Confondre harmonie et immobilisme",
"Confondre intuition et émotion",
"Confondre réflexion et savoir",
"Confondre désir et passion"
],

bonne : 0,

explication :
"Chercher l'équilibre ne signifie pas éviter toute évolution ou toute prise de décision."
},

{
question :
"Laquelle de ces phrases résume le mieux Tempérance lumineuse ?",

reponses : [
"J'apprends à vivre autrement",
"Je contrôle tout",
"J'accélère le changement",
"Je conserve exactement la même vie qu'avant"
],

bonne : 0,

explication :
"Tempérance aide à retrouver une vie fluide après une période de bouleversement."
},

{
question :
"Complète la progression initiatique : Arcane Sans Nom : Je transforme – Tempérance : ?",

reponses : [
"J'harmonise",
"Je rayonne",
"Je maîtrise",
"Je ressens"
],

bonne : 0,

explication :
"Dans ton parcours initiatique, Tempérance correspond à la mission : J'harmonise."
},

{
question :
"Quelle différence fondamentale existe entre la Justice et Tempérance ?",

reponses : [
"La Justice rétablit l'équilibre par la décision ; Tempérance le rétablit par la circulation et l'adaptation",
"La Justice agit lentement alors que Tempérance agit vite",
"Tempérance punit alors que la Justice conseille",
"Il n'existe aucune différence importante"
],

bonne : 0,

explication :
"La Justice tranche. Tempérance relie. Toutes deux recherchent l'équilibre mais utilisent des moyens différents."
},

{
question :
"Quelle différence fondamentale existe entre l'Arcane Sans Nom et Tempérance ?",

reponses : [
"L'Arcane Sans Nom transforme ; Tempérance aide à intégrer cette transformation dans la vie quotidienne",
"L'Arcane Sans Nom ralentit ; Tempérance accélère",
"Tempérance détruit ; l'Arcane Sans Nom construit",
"Ces deux cartes racontent exactement la même étape"
],

bonne : 0,

explication :
"L'Arcane XIII coupe l'ancien monde. Tempérance aide à vivre dans le nouveau."
},

{
question :
"Après un grave accident, un conducteur achète progressivement un véhicule plus adapté à sa nouvelle situation. Il réapprend à conduire calmement, reprend confiance et découvre une manière plus sereine de vivre. Quelle carte décrit le mieux cette étape ?",

reponses : [
"Le Chariot",
"Le Pendu",
"Tempérance",
"La Justice"
],

bonne : 2,

explication :
"Tempérance symbolise la réadaptation et la réconciliation avec la vie après une transformation profonde."
},

{
question :
"Le conducteur qui a traversé toutes ces épreuves commence maintenant à conseiller d'autres automobilistes pour éviter qu'ils commettent les mêmes erreurs. Quelle facette de Tempérance exprime-t-il ici ?",

reponses : [
"La circulation harmonieuse de l'expérience et du savoir",
"La volonté de dominer les autres",
"Le refus du changement",
"La peur de conduire"
],

bonne : 0,

explication :
"Tempérance crée des ponts. Elle fait circuler ce qui a été appris afin que l'expérience serve aux autres."
}

];

/************************************************
NE RIEN MODIFIER EN DESSOUS
************************************************/

document.getElementById("titreQuiz").innerText =
quizTitre;

const container =
document.getElementById("quizContainer");

quizData.forEach((q, index)=>{

let html =
`
<div class="question">

<h3>

Question ${index+1}

</h3>

<p>${q.question}</p>
`;

q.reponses.forEach((r, i)=>{

html +=
`
<label>

<input
type="radio"
name="q${index}"
value="${i}">

${r}

</label>

<br>

`;

});

html +=
`
<div id="feedback${index}"></div>

</div>
`;

container.innerHTML += html;

});

function corrigerQuiz(){

let score = 0;

quizData.forEach((q,index)=>{

let reponse =
document.querySelector(
'input[name="q'+index+'"]:checked'
);

let feedback =
document.getElementById(
"feedback"+index
);

if(
reponse &&
parseInt(reponse.value)
=== q.bonne
){

score++;

feedback.innerHTML =
`
<div class="bonne">

✅ Bonne réponse

</div>

<div class="explication">

${q.explication}

</div>
`;

}
else{

feedback.innerHTML =
`
<div class="mauvaise">

❌ Mauvaise réponse

</div>

<div class="explication">

Bonne réponse :
${q.reponses[q.bonne]}

<br><br>

${q.explication}

</div>
`;

}

});

let appreciation = "";

if(score === quizData.length){

appreciation =
"⭐⭐⭐⭐⭐ Maîtrise parfaite";

}
else if(score >= 4){

appreciation =
"⭐⭐⭐⭐ Très bonne compréhension";

}
else if(score >= 3){

appreciation =
"⭐⭐⭐ Bases acquises";

}
else if(score >= 2){

appreciation =
"⭐⭐ À renforcer";

}
else{

appreciation =
"⭐ Révision nécessaire";

}

document.getElementById(
"resultat"
).style.display="block";

document.getElementById(
"resultat"
).innerHTML =

`
<h2>

Résultat

</h2>

<p>

Score :
<strong>

${score}/${quizData.length}

</strong>

</p>

<p>

${appreciation}

</p>
`;

window.scrollTo(
0,
document.body.scrollHeight
);

}

</script>

</body>

</html>
