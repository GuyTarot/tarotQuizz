<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TarotQuizz</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,0.15);
}

h1{
    text-align:center;
    color:#2c3e50;
}

.question{
    margin-bottom:30px;
    padding-bottom:20px;
    border-bottom:1px solid #ddd;
}

.question h3{
    color:#34495e;
}

button{
    background:#2c3e50;
    color:white;
    border:none;
    padding:15px 25px;
    border-radius:8px;
    cursor:pointer;
    font-size:18px;
}

button:hover{
    background:#1a252f;
}

#resultat{
    display:none;
    margin-top:30px;
    padding:20px;
    background:#ecf9f0;
    border:1px solid #28a745;
    border-radius:10px;
}

.bonne{
    color:green;
    margin-top:10px;
}

.mauvaise{
    color:red;
    margin-top:10px;
}

.explication{
    margin-top:5px;
    font-style:italic;
}

</style>

</head>

<body>

<div class="container">

<h1 id="titreQuiz"></h1>

<p>

Nom :

<input type="text"
id="nom"
placeholder="Votre prénom">

</p>

<form id="quizContainer"></form>

<button onclick="corrigerQuiz()">

Valider le quiz

</button>

<div id="resultat"></div>

</div>

<script>

/************************************************
MODIFIER UNIQUEMENT CI-DESSOUS
************************************************/

const quizTitre =
"Quiz : L'Ermite";

const quizData = [

{
question :
"Quelle est la mission principale de l'Ermite ?",

reponses : [
"Faire de nouvelles expériences",
"Chercher le sens de l'expérience vécue",
"Construire un projet durable",
"Prendre une décision importante"
],

bonne : 1,

explication :
"L'Ermite cherche à comprendre ce qu'il a appris de la vie. Il transforme l'expérience en sagesse."
},

{
question :
"Parmi ces propositions, laquelle correspond le mieux à l'énergie lumière de l'Ermite ?",

reponses : [
"Sagesse, discernement, profondeur",
"Passion, aventure, spontanéité",
"Puissance, domination, autorité",
"Créativité, communication, expression"
],

bonne : 0,

explication :
"L'Ermite est la carte du recul, de la réflexion et de la compréhension profonde."
},

{
question :
"Dans un tirage, l'Ermite apparaît en position CONTRE. Quelle interprétation est la plus cohérente ?",

reponses : [
"Le consultant agit trop vite",
"Le consultant risque de s'enfermer dans l'isolement ou de refuser d'avancer",
"C'est une garantie de réussite",
"Le consultant manque de créativité"
],

bonne : 1,

explication :
"L'ombre de l'Ermite apparaît lorsque la réflexion devient immobilisme ou fermeture."
},

{
question :
"Quelle est l'erreur fréquente de l'Ermite ?",

reponses : [
"Confondre sagesse et retrait du monde",
"Confondre émotion et intuition",
"Confondre vitesse et efficacité",
"Confondre désir et besoin"
],

bonne : 0,

explication :
"Comprendre le monde ne signifie pas nécessairement s'en retirer."
},

{
question :
"Laquelle de ces phrases résume le mieux l'Ermite lumineux ?",

reponses : [
"Je prends mon temps pour comprendre",
"J'avance coûte que coûte",
"Je choisis ce qui me plaît",
"Je transforme ce qui doit mourir"
],

bonne : 0,

explication :
"L'Ermite privilégie la compréhension à la rapidité."
},

{
question :
"Complète la progression initiatique : Justice : J'équilibre – Ermite : ?",

reponses : [
"Je transforme",
"Je cherche",
"Je maîtrise",
"Je ressens"
],

bonne : 1,

explication :
"Dans ton parcours initiatique, l'Ermite correspond à la mission : Je cherche."
},

{
question :
"Quelle différence fondamentale existe entre la Papesse et l'Ermite ?",

reponses : [
"La Papesse accumule le savoir alors que l'Ermite transforme le savoir en sagesse",
"La Papesse agit alors que l'Ermite imagine",
"La Papesse construit alors que l'Ermite transmet",
"Il s'agit exactement de la même démarche"
],

bonne : 0,

explication :
"La Papesse étudie et apprend. L'Ermite cherche à comprendre profondément ce qu'il a appris."
},

{
question :
"Quelle différence fondamentale existe entre l'Ermite et le Pendu ?",

reponses : [
"L'Ermite avance lentement alors que le Pendu suspend complètement le mouvement",
"L'Ermite agit vite alors que le Pendu agit lentement",
"Le Pendu est tourné vers le passé alors que l'Ermite regarde l'avenir",
"Il n'existe aucune différence importante"
],

bonne : 0,

explication :
"L'Ermite continue son chemin, même lentement. Le Pendu, lui, accepte l'arrêt et le changement de perspective."
},

{
question :
"Un conducteur perd son permis après plusieurs excès de vitesse. Obligé de marcher davantage ou de prendre les transports en commun, il réfléchit à son comportement et comprend enfin les leçons que la vie essayait de lui enseigner. Quelle carte décrit le mieux cette étape ?",

reponses : [
"Le Chariot",
"La Justice",
"L'Ermite",
"La Force"
],

bonne : 2,

explication :
"Le Chariot correspond à l'action. La Justice correspond à la conséquence. L'Ermite correspond à l'intégration de la leçon. Il cherche du sens à ce qui lui est arrivé. C'est pourquoi il avance désormais plus lentement mais avec davantage de conscience."
}

];

/************************************************
NE RIEN MODIFIER EN DESSOUS
************************************************/

document.getElementById("titreQuiz").innerText =
quizTitre;

const container =
document.getElementById("quizContainer");

quizData.forEach((q, index)=>{

let html =
`
<div class="question">

<h3>

Question ${index+1}

</h3>

<p>${q.question}</p>
`;

q.reponses.forEach((r, i)=>{

html +=
`
<label>

<input
type="radio"
name="q${index}"
value="${i}">

${r}

</label>

<br>

`;

});

html +=
`
<div id="feedback${index}"></div>

</div>
`;

container.innerHTML += html;

});

function corrigerQuiz(){

let score = 0;

quizData.forEach((q,index)=>{

let reponse =
document.querySelector(
'input[name="q'+index+'"]:checked'
);

let feedback =
document.getElementById(
"feedback"+index
);

if(
reponse &&
parseInt(reponse.value)
=== q.bonne
){

score++;

feedback.innerHTML =
`
<div class="bonne">

✅ Bonne réponse

</div>

<div class="explication">

${q.explication}

</div>
`;

}
else{

feedback.innerHTML =
`
<div class="mauvaise">

❌ Mauvaise réponse

</div>

<div class="explication">

Bonne réponse :
${q.reponses[q.bonne]}

<br><br>

${q.explication}

</div>
`;

}

});

let appreciation = "";

if(score === quizData.length){

appreciation =
"⭐⭐⭐⭐⭐ Maîtrise parfaite";

}
else if(score >= 4){

appreciation =
"⭐⭐⭐⭐ Très bonne compréhension";

}
else if(score >= 3){

appreciation =
"⭐⭐⭐ Bases acquises";

}
else if(score >= 2){

appreciation =
"⭐⭐ À renforcer";

}
else{

appreciation =
"⭐ Révision nécessaire";

}

document.getElementById(
"resultat"
).style.display="block";

document.getElementById(
"resultat"
).innerHTML =

`
<h2>

Résultat

</h2>

<p>

Score :
<strong>

${score}/${quizData.length}

</strong>

</p>

<p>

${appreciation}

</p>
`;

window.scrollTo(
0,
document.body.scrollHeight
);

}

</script>

</body>

</html>
