<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TarotQuizz</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,0.15);
}

h1{
    text-align:center;
    color:#2c3e50;
}

.question{
    margin-bottom:30px;
    padding-bottom:20px;
    border-bottom:1px solid #ddd;
}

.question h3{
    color:#34495e;
}

button{
    background:#2c3e50;
    color:white;
    border:none;
    padding:15px 25px;
    border-radius:8px;
    cursor:pointer;
    font-size:18px;
}

button:hover{
    background:#1a252f;
}

#resultat{
    display:none;
    margin-top:30px;
    padding:20px;
    background:#ecf9f0;
    border:1px solid #28a745;
    border-radius:10px;
}

.bonne{
    color:green;
    margin-top:10px;
}

.mauvaise{
    color:red;
    margin-top:10px;
}

.explication{
    margin-top:5px;
    font-style:italic;
}

</style>

</head>

<body>

<div class="container">

<h1 id="titreQuiz"></h1>

<p>

Nom :

<input type="text"
id="nom"
placeholder="Votre prénom">

</p>

<form id="quizContainer"></form>

<button onclick="corrigerQuiz()">

Valider le quiz

</button>

<div id="resultat"></div>

</div>

<script>

/************************************************
MODIFIER UNIQUEMENT CI-DESSOUS
************************************************/

const quizTitre =
"Quiz : L'Amoureux";

const quizData = [

{
question :
"Quelle est la mission principale de l'Amoureux ?",

reponses : [
"Construire des bases solides",
"Trouver un mentor",
"Faire un choix aligné avec ses valeurs",
"Transformer une situation"
],

bonne : 2,

explication :
"L'Amoureux est l'arcane du choix. Il invite à s'engager dans une direction qui correspond à ses valeurs profondes."
},

{
question :
"Parmi ces propositions, laquelle correspond le mieux à l'énergie lumière de l'Amoureux ?",

reponses : [
"Choix, authenticité, engagement",
"Contrôle, autorité, discipline",
"Patience, solitude, introspection",
"Transformation, rupture, renaissance"
],

bonne : 0,

explication :
"L'énergie lumière de l'Amoureux consiste à choisir librement et à assumer pleinement sa décision."
},

{
question :
"Dans un tirage, l'Amoureux apparaît en position CONTRE. Quelle interprétation est la plus cohérente ?",

reponses : [
"Le consultant agit trop vite",
"Le consultant hésite à faire un choix ou cherche à satisfaire tout le monde",
"Le consultant manque de connaissances",
"Le consultant doit voyager davantage"
],

bonne : 1,

explication :
"L'Amoureux en ombre se manifeste souvent par l'indécision ou le besoin de plaire à tous."
},

{
question :
"Quelle est l'erreur fréquente de l'Amoureux ?",

reponses : [
"Confondre émotion et intuition",
"Confondre choix et absence de renoncement",
"Confondre autorité et responsabilité",
"Confondre volonté et pouvoir"
],

bonne : 1,

explication :
"Choisir implique toujours de renoncer à d'autres possibilités."
},

{
question :
"Laquelle de ces phrases résume le mieux l'Amoureux lumineux ?",

reponses : [
"Je choisis ce qui me correspond",
"Je construis pour durer",
"Je maîtrise mon énergie",
"Je cherche la vérité"
],

bonne : 0,

explication :
"L'Amoureux lumineux accepte d'assumer un choix authentique."
},

{
question :
"Complète la progression initiatique : Pape : Je transmets – Amoureux : ?",

reponses : [
"J'avance",
"Je choisis",
"Je construis",
"Je maîtrise"
],

bonne : 1,

explication :
"Dans ton parcours initiatique, l'Amoureux correspond à la mission : Je choisis."
},

{
question :
"Quelle différence fondamentale existe entre le Bateleur et l'Amoureux ?",

reponses : [
"Le Bateleur agit, l'Amoureux ressent",
"Le Bateleur représente l'élan du débutant alors que l'Amoureux doit choisir une direction parmi plusieurs possibilités",
"Le Bateleur transmet un savoir et l'Amoureux construit une structure",
"Il n'existe aucune différence importante"
],

bonne : 1,

explication :
"Le Bateleur dit : « J'ose ». L'Amoureux dit : « Je choisis ». Le premier explore les possibles ; le second sélectionne l'un d'eux et s'engage."
},

{
question :
"Une consultante hésite entre conserver un emploi stable ou créer son activité indépendante. L'Amoureux apparaît en conseil. Que suggère-t-il ?",

reponses : [
"Attendre encore plusieurs années",
"Choisir l'option qui rassure son entourage",
"Clarifier ce qu'elle veut réellement et s'engager dans cette direction",
"Demander à quelqu'un d'autre de choisir à sa place"
],

bonne : 2,

explication :
"L'Amoureux invite à un choix aligné avec soi-même et non avec les attentes extérieures."
}

];

/************************************************
NE RIEN MODIFIER EN DESSOUS
************************************************/

document.getElementById("titreQuiz").innerText =
quizTitre;

const container =
document.getElementById("quizContainer");

quizData.forEach((q, index)=>{

let html =
`
<div class="question">

<h3>

Question ${index+1}

</h3>

<p>${q.question}</p>
`;

q.reponses.forEach((r, i)=>{

html +=
`
<label>

<input
type="radio"
name="q${index}"
value="${i}">

${r}

</label>

<br>

`;

});

html +=
`
<div id="feedback${index}"></div>

</div>
`;

container.innerHTML += html;

});

function corrigerQuiz(){

let score = 0;

quizData.forEach((q,index)=>{

let reponse =
document.querySelector(
'input[name="q'+index+'"]:checked'
);

let feedback =
document.getElementById(
"feedback"+index
);

if(
reponse &&
parseInt(reponse.value)
=== q.bonne
){

score++;

feedback.innerHTML =
`
<div class="bonne">

✅ Bonne réponse

</div>

<div class="explication">

${q.explication}

</div>
`;

}
else{

feedback.innerHTML =
`
<div class="mauvaise">

❌ Mauvaise réponse

</div>

<div class="explication">

Bonne réponse :
${q.reponses[q.bonne]}

<br><br>

${q.explication}

</div>
`;

}

});

let appreciation = "";

if(score === quizData.length){

appreciation =
"⭐⭐⭐⭐⭐ Maîtrise parfaite";

}
else if(score >= 4){

appreciation =
"⭐⭐⭐⭐ Très bonne compréhension";

}
else if(score >= 3){

appreciation =
"⭐⭐⭐ Bases acquises";

}
else if(score >= 2){

appreciation =
"⭐⭐ À renforcer";

}
else{

appreciation =
"⭐ Révision nécessaire";

}

document.getElementById(
"resultat"
).style.display="block";

document.getElementById(
"resultat"
).innerHTML =

`
<h2>

Résultat

</h2>

<p>

Score :
<strong>

${score}/${quizData.length}

</strong>

</p>

<p>

${appreciation}

</p>
`;

window.scrollTo(
0,
document.body.scrollHeight
);

}

</script>

</body>

</html>
